<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Lautaro Martínez — Paid Media Manager</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Lautaro Martínez — Paid Media Manager">
<meta property="og:description" content="Paid Media Manager en Digitalmix. Meta Ads, Google Ads, GA4 y GTM: estrategia, medición y optimización para ecommerce y generación de leads.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Manrope:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0F172A}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
a{color:inherit}a:hover{color:inherit}
.pf{--bg:#0F172A;--bg2:#121C32;--tx:#F8FAFC;--mu:#94A3B8;--di:#64748B;--ln:rgba(248,250,252,.1);--gr:#22C55E;--bl:#2563EB;--blh:#1D4ED8;--fd:"Space Grotesk","Helvetica Neue",Arial,sans-serif;--fb:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1);--edr:cubic-bezier(.32,.72,0,1);--es:cubic-bezier(.25,.1,.25,1);position:relative;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
.pf *,.pf *::before,.pf *::after{box-sizing:border-box}
.pf a{text-decoration:none}
.pf ::selection{background:var(--gr);color:var(--bg)}
.pf :focus-visible{outline:2px solid var(--bl);outline-offset:3px;border-radius:4px}
.pf button{font:inherit;color:inherit}
.pf h1,.pf h2,.pf h3,.pf p,.pf ul,.pf ol,.pf figure,.pf blockquote{margin:0;padding:0}
.pf ul,.pf ol{list-style:none}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding-inline:clamp(20px,4.4vw,64px)}
.mono{font-family:var(--fm);font-size:11.5px;line-height:1.5;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.h2{font-family:var(--fd);font-weight:600;font-size:clamp(34px,4.6vw,68px);letter-spacing:-.045em;line-height:1.02;max-width:15ch}
.lm{display:block;overflow:visible}
.skip{position:fixed;left:16px;top:-80px;z-index:100;background:var(--bl);color:var(--tx);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600}
.skip:focus{top:16px}

/* reveal */
.rv{opacity:0;transform:translate3d(0,12px,0)}
.in .rv{opacity:1;transform:none;transition:opacity .8s var(--eo),transform .8s var(--eo)}
.ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.li{display:block;transform:translate3d(0,108%,0)}
.in .li{transform:none;transition:transform 1s var(--eo)}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;border-bottom:1px solid transparent;transition:background-color .25s var(--es),border-color .25s var(--es)}
.nav.solid{background:rgba(15,23,42,.92);border-bottom-color:var(--ln)}
.nav-in{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:inline-flex;align-items:center;gap:11px;min-height:44px}
.logo .lm{width:30px;height:auto;color:var(--tx)}
.logo span{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:-.015em;line-height:1}
.nav-r{display:flex;align-items:center;gap:clamp(20px,2.6vw,40px)}
.nl{display:inline-flex;align-items:center;min-height:44px;font-size:14.5px;font-weight:500;color:var(--mu);transition:color .15s var(--es)}
.nl.on,.nl-cta{color:var(--tx)}
.nl-cta{gap:8px}
.nl-cta i{width:6px;height:6px;border-radius:50%;background:var(--gr)}
.menu-btn{display:none;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ln);background:none;font-size:14px;font-weight:600;cursor:pointer}
.mm{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:108px clamp(20px,4.4vw,64px) 32px;animation:mmIn .42s var(--edr)}
.mm-l{display:block;padding:12px 0;border-bottom:1px solid var(--ln);font-family:var(--fd);font-weight:600;letter-spacing:-.04em;font-size:clamp(34px,10vw,56px);line-height:1.05}
@keyframes mmIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;background:var(--bl);color:var(--tx);font-weight:600;font-size:15px;transition:background-color .2s var(--es),transform .16s var(--eo)}
.btn:active{transform:scale(.97)}
.btn svg,.tl svg,.case-i svg{width:16px;height:16px;flex:none;transition:transform .25s var(--eo)}
.tl{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:15px;color:var(--tx)}
.tl::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:currentColor;opacity:.35;transform-origin:0 50%;transition:opacity .2s var(--es)}

/* hero */
.hero{position:relative;min-height:max(680px,min(100svh,960px));display:flex;flex-direction:column;padding-top:76px;overflow:hidden}
.hero-field{position:absolute;top:120px;right:-2vw;width:min(58vw,940px);aspect-ratio:3/2;opacity:0;transition:opacity 1.6s var(--es) .2s;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%);pointer-events:none}
.in .hero-field{opacity:1}
.hero-field svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.pt1{fill:rgba(248,250,252,.2)}.pt2{fill:rgba(248,250,252,.45)}
.lane{fill:none;stroke:rgba(248,250,252,.12);stroke-width:1}
.crv{fill:none;stroke:var(--gr);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.in .crv{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s var(--eio) .8s}
.arr{fill:var(--gr);opacity:0}
.in .arr{opacity:1;transition:opacity .4s var(--es) 2.45s}
.hero-in{position:relative;flex:1;display:flex;flex-direction:column;gap:clamp(36px,4vw,56px);padding-top:28px;padding-bottom:clamp(40px,5vw,72px)}
.hero-name{margin-top:auto;font-family:var(--fd);font-weight:700;font-size:clamp(56px,12vw,176px);line-height:.86;letter-spacing:-.06em}
.hero-b{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:end}
.claim{grid-column:1 / span 6;font-family:var(--fd);font-weight:500;font-size:clamp(26px,2.6vw,40px);line-height:1.08;letter-spacing:-.035em;max-width:17ch}
.hero-r{grid-column:8 / span 5;display:flex;flex-direction:column;gap:24px}
.sub{color:var(--mu);font-size:16px;max-width:44ch}
.ctas{display:flex;align-items:center;gap:28px;flex-wrap:wrap}

/* clients */
.cl-in{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding-top:24px;border-top:1px solid var(--ln)}
.lg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:44px 16px}
.lg-c{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.lg-i{height:64px;width:100%;display:flex;align-items:center;justify-content:center}
.lg-i img{display:block;max-width:82%;height:auto;opacity:.92}
.lg-c > span{font-size:12.5px;line-height:1.3;color:var(--mu);text-align:center}

/* sections */
.sec{padding-top:clamp(120px,14vw,208px)}
.sg{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px}
.sl{padding-top:16px}
.sc{display:flex;flex-direction:column;gap:clamp(44px,5vw,72px);min-width:0}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:var(--mu);max-width:54ch}
.lead b{color:var(--tx);font-weight:600}
.rows{border-top:1px solid var(--ln)}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--ln);font-size:15.5px;line-height:1.45}
.row > span:last-child{color:var(--mu);font-size:14px;text-align:right}
.row.two{grid-template-columns:120px minmax(0,1fr)}
.row.two > span:last-child{color:var(--tx);font-size:15.5px;text-align:left}

.cr{display:grid;grid-template-columns:120px minmax(0,1fr) auto 24px;gap:16px;align-items:baseline;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;cursor:pointer;font-size:15.5px;line-height:1.45;color:var(--tx)}
.cr-o{color:var(--mu);font-size:14px;text-align:right}
.cr-v{align-self:center;display:inline-flex;justify-content:flex-end;color:var(--mu);transition:color .2s var(--es),transform .25s var(--eo)}
.cr-v svg{width:15px;height:15px}
.top{display:inline-flex;align-items:center;height:20px;margin-left:10px;padding:0 8px;border-radius:999px;border:1px solid rgba(34,197,94,.45);color:var(--gr);font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px;white-space:nowrap}
.stk{display:flex;flex-wrap:wrap;gap:14px 30px}
.stk li{display:inline-flex;align-items:center;gap:10px;font-size:15.5px}
.stk img{display:block;height:24px;width:auto;opacity:.92}

/* certificate lightbox */
.lb{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px)}
.lb-f{position:relative;z-index:1;width:min(1000px,100%);display:flex;flex-direction:column;gap:16px;animation:lbIn .32s var(--eo)}
.lb.out .lb-f,.lb.out .md-bg{animation:fadeOut .2s var(--es) forwards}
.lb-f img{display:block;width:100%;height:auto;max-height:calc(100svh - 190px);object-fit:contain;border-radius:8px}
.lb-c{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lb-c b{display:block;font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:-.02em;line-height:1.25}
.lb-c small{display:block;margin-top:2px;font-size:14px;color:var(--mu)}
@keyframes lbIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* about */
.ab{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:clamp(28px,4vw,64px);align-items:stretch}
.portrait{position:relative;align-self:stretch;aspect-ratio:4/5;border-radius:12px;background:var(--bg2);overflow:hidden}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.dm{display:inline-flex;align-items:center;gap:16px;align-self:flex-start;min-height:44px}
.dm img{display:block;width:40px;height:auto;flex:none}
.dm b{display:block;font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:-.025em;line-height:1.2}
.dm small{display:block;font-size:14px;color:var(--mu)}
.ab-t{display:flex;flex-direction:column;justify-content:space-between;gap:36px;min-width:0}
.ab-top{display:flex;flex-direction:column;gap:28px}
.sg-sub{margin-top:clamp(72px,8vw,120px)}
.sl-n{margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.fact{display:flex;flex-direction:column;gap:6px}
.fv{font-family:var(--fd);font-weight:600;font-size:clamp(30px,2.8vw,42px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.fl{font-size:14px;line-height:1.4;color:var(--mu)}

/* services */
.svc{border-top:1px solid var(--ln)}
.sv{display:grid;grid-template-columns:48px minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--ln)}
.sv-t{font-family:var(--fd);font-weight:600;font-size:clamp(20px,1.9vw,26px);letter-spacing:-.03em;line-height:1.15}
.sv-d{color:var(--mu);font-size:15.5px;line-height:1.5}

/* method */
.mt{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:20px;padding-top:28px}
.mt-line{position:absolute;left:0;right:0;top:0;height:1px;background:var(--ln);overflow:hidden}
.mt-fill{position:absolute;inset:0;background:var(--bl);transform-origin:0 50%;transform:scaleX(0)}
.in .mt-fill{transform:none;transition:transform 1.6s var(--eio) .3s}
.mt-s{display:flex;flex-direction:column;gap:8px}
.mt-w{font-family:var(--fd);font-weight:600;font-size:clamp(17px,1.4vw,20px);letter-spacing:-.03em;line-height:1.1}
.mt-d{font-size:14px;line-height:1.45;color:var(--mu)}

/* results */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px}
.fig{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1px solid var(--ln)}
.fig-v{font-family:var(--fd);font-weight:600;font-size:clamp(44px,6vw,92px);letter-spacing:-.06em;line-height:.9;color:var(--gr);font-variant-numeric:tabular-nums}
.fig-l{font-size:15px;line-height:1.45;color:var(--mu);max-width:34ch}
.cases{border-top:1px solid var(--ln)}
.case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:24px 0;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;cursor:pointer}
.case-t{display:block;font-family:var(--fd);font-weight:600;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.035em;line-height:1.1}
.case-s{display:block;margin-top:6px;font-size:14px;color:var(--mu)}
.case-i{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);transition:background-color .2s var(--es),border-color .2s var(--es)}

/* testimonials */
.difs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;border-top:1px solid var(--ln)}
.difs li{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:16.5px;line-height:1.4}
.difs li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gr);transform:translateY(-2px)}
.car{min-width:0}
.car-t{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-right:calc(-1 * clamp(20px,4.4vw,64px));padding-right:clamp(20px,4.4vw,64px);padding-bottom:4px}
.car-t::-webkit-scrollbar{display:none}
.car-t::after{content:"";flex:0 0 1px}
.car-t:focus-visible{outline-offset:6px}
.pf .vc{flex:0 0 clamp(286px,31vw,420px);scroll-snap-align:start;display:flex;flex-direction:column;gap:22px;margin:0;padding:28px;border:1px solid var(--ln);border-radius:16px;background:var(--bg2)}
.vc-lw{height:36px;display:flex;align-items:center}
.vc-lw img{display:block;height:auto;max-height:36px;opacity:.92}
.vc-q{flex:1;font-size:16.5px;line-height:1.6;color:var(--tx)}
.vc-f{display:flex;flex-direction:column;gap:2px;padding-top:18px;border-top:1px solid var(--ln)}
.vo-name{font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:-.02em}
.vo-role{font-size:14px;color:var(--mu)}
.car-c{display:flex;align-items:center;gap:16px;margin-top:28px}
.cbar{position:relative;flex:1;height:2px;border-radius:2px;background:var(--ln);overflow:hidden}
.cthumb{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--tx);border-radius:2px}
.icb:disabled{opacity:.3;cursor:default}
.icb{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:none;cursor:pointer;transition:background-color .2s var(--es),color .2s var(--es),transform .16s var(--eo)}
.icb:active{transform:scale(.95)}
.icb svg{width:17px;height:17px}
.qa{animation:qa .44s var(--eo)}
.qb{animation:qb .44s var(--eo)}
@keyframes qa{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
@keyframes qb{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}

/* philosophy */
.ph-q{font-family:var(--fd);font-weight:600;font-size:clamp(36px,6vw,96px);letter-spacing:-.05em;line-height:1}
.w{opacity:.15;transition:opacity .45s var(--es)}
.w.lit{opacity:1}

/* contact */
.ct-h{font-family:var(--fd);font-weight:700;font-size:clamp(44px,8vw,128px);letter-spacing:-.055em;line-height:.92}
.ct-b{display:flex;flex-direction:column;gap:30px;max-width:560px}
.ct-links{display:flex;flex-wrap:wrap;gap:4px 32px}
.ct-links .tl{color:var(--mu)}
.ct-links .pend{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--di)}
.ft{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;margin-top:clamp(120px,14vw,208px);padding:24px 0 32px;border-top:1px solid var(--ln)}

/* modal */
.md{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.md-bg{position:absolute;inset:0;width:100%;border:0;padding:0;background:rgba(8,12,24,.78);cursor:pointer;animation:fadeIn .3s var(--es)}
.md-p{position:relative;width:min(1080px,100%);max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0;animation:sheetUp .46s var(--edr)}
.md.out .md-bg{animation:fadeOut .26s var(--es) forwards}
.md.out .md-p{animation:sheetDown .26s var(--eo) forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translate3d(0,100%,0)}}
.md-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(20px,4vw,56px);background:var(--bg);border-bottom:1px solid var(--ln)}
.md-body{padding:clamp(28px,4vw,56px)}
.md-t{font-family:var(--fd);font-weight:700;font-size:clamp(36px,5vw,72px);letter-spacing:-.055em;line-height:.95}
.md-big{display:block;margin-top:24px;font-family:var(--fd);font-weight:600;font-size:clamp(48px,6vw,88px);letter-spacing:-.06em;line-height:.9;color:var(--gr);font-variant-numeric:tabular-nums}
.md-cap{display:block;margin-top:10px;font-size:15px;color:var(--mu)}
.md-sec{display:grid;grid-template-columns:180px minmax(0,1fr);gap:clamp(16px,3vw,40px);padding:28px 0;border-top:1px solid var(--ln)}
.md-sec h3{font-family:var(--fd);font-weight:600;font-size:20px;letter-spacing:-.025em;line-height:1.2}
.md-sec p{font-size:clamp(17px,1.4vw,19px);line-height:1.55;max-width:60ch}
.md-ul li{padding:10px 0;border-bottom:1px solid var(--ln);color:var(--mu);font-size:16px}
.md-ul li:first-child{padding-top:0}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px}
.re{display:flex;flex-direction:column;gap:6px}
.re b{font-family:var(--fd);font-weight:600;font-size:clamp(30px,3vw,42px);letter-spacing:-.05em;line-height:1;color:var(--gr);font-variant-numeric:tabular-nums}
.re span{font-size:14px;color:var(--mu)}
.md-src{margin-top:20px}

@media (hover:hover) and (pointer:fine){
  .nl:hover{color:var(--tx)}

  .sv{grid-template-columns:36px minmax(0,1fr);gap:6px 12px}

  .mt{grid-template-columns:1fr;padding-top:0;row-gap:0}

  .mt-d{grid-column:2}

  .ft{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

      carAuto: !!s.carAuto,

      carLive: s.carAuto ? "off" : "polite",
      carPlayLabel: s.carAuto ? "Pausar carrusel" : "Reproducir carrusel",
      cEnd: !!s.cEnd,
      words: words,
      certs: CERTS.map((c, i) => ({ d: c.d, t: c.t, o: c.o, top: c.top, open: this._certOpeners[i] })),
      certOpen: s.certOpen != null,
      cert: (() => { const c = CERTS[s.certOpen == null ? 0 : s.certOpen]; return { src: c.src, alt: "Certificado: " + c.t, t: c.t, meta: c.meta }; })(),
      lbCls: s.cClosing ? "out" : "",
      caseOpen: !!s.caseOpen,
      mdCls: s.closing ? "out" : "",
      cs: cs
    };
  }
}


Component.prototype.render=function(){return DCR.build(this.renderVals());};
preact.render(preact.h(Component,{}),document.getElementById('app'));
</script>
</body>
</html>
